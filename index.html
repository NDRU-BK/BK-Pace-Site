<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Burger King Rennes · nouvelle adresse</title>
<meta http-equiv="refresh" content="3;url=https://bk-rennes.com/">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f5eee4;--card:#fff;--ink:#2a1208;--mut:#7a6a5f;--org:#ff8732;--hd:#4f2113;--line:#e3d8cc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1109;--card:#2a1a10;--ink:#f5eee4;--mut:#b9a999;--line:#4a3426;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.c{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.h{background:var(--hd);color:#fff;padding:20px 24px;font-size:22px;font-weight:700;letter-spacing:.01em}
.b{padding:24px}
.b p{margin:0 0 14px}
.m{color:var(--mut);font-size:14px}
a.btn{display:block;text-align:center;background:var(--org);color:#2a1208;font-weight:700;text-decoration:none;padding:14px 18px;border-radius:12px;margin:18px 0 12px}
a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.u{word-break:break-all;font-weight:600}
</style>
</head>
<body>
<main class="c">
<div class="h">Burger King Rennes</div>
<div class="b">
<p><strong>Le site a changé d’adresse.</strong></p>
<p>Nouvelle adresse : <span class="u">bk-rennes.com</span></p>
<a class="btn" id="go" href="https://bk-rennes.com/">Ouvrir le site</a>
<p class="m">Vous allez être redirigé automatiquement. Pensez à mettre à jour votre favori ou le raccourci sur votre téléphone.</p>
</div>
</main>
<script>
(function(){try{var h=location.hash||"";var u="https://bk-rennes.com/"+h;document.getElementById("go").href=u;setTimeout(function(){location.replace(u)},1500)}catch(e){}})();
</script>
</body>
</html>
